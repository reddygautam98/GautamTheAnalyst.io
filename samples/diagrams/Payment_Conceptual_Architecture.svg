<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc"><title id="title">PayTrack conceptual architecture</title><desc id="desc">Illustrative architecture containing UI, API, gateway, transaction store and reconciliation worker with control requirements.</desc><defs><style>.t{font:700 16px Arial,sans-serif;fill:#172033}.s{font:12px Arial,sans-serif;fill:#657085}.e{stroke:#8997ad;stroke-width:2.5;fill:none}</style></defs><rect width="1100" height="440" rx="24" fill="#f8fafc"/><text x="30" y="40" style="font:800 22px Arial,sans-serif;fill:#172033">PAYTRACK / CONCEPTUAL ARCHITECTURE</text><text x="30" y="64" class="s">Fictional design concept · implementation choices require engineering review</text><g stroke-width="1.5"><rect x="35" y="110" width="220" height="96" rx="16" fill="#fff" stroke="#dce3ed"/><rect x="320" y="110" width="220" height="96" rx="16" fill="#fff3e9" stroke="#ed995e"/><rect x="605" y="110" width="220" height="96" rx="16" fill="#fff" stroke="#dce3ed"/><rect x="865" y="110" width="200" height="96" rx="16" fill="#e8f1ff" stroke="#9abaf1"/><rect x="320" y="265" width="220" height="88" rx="16" fill="#fff5d9" stroke="#e7b957"/><rect x="605" y="265" width="460" height="88" rx="16" fill="#e5f7ed" stroke="#83c9a5"/></g><g text-anchor="middle" class="t"><text x="145" y="145">Operations UI</text><text x="430" y="145">Application API</text><text x="715" y="145">Transaction Store</text><text x="965" y="145">Gateway</text><text x="430" y="296">Reconciliation Worker</text><text x="835" y="296">Cross-cutting controls</text></g><g text-anchor="middle" class="s"><text x="145" y="168">Search · queue · case detail</text><text x="430" y="168">Validation · permissions</text><text x="715" y="168">Payments · events · cases</text><text x="965" y="168">Payment callbacks</text><text x="430" y="319">Matching rules · exceptions</text><text x="835" y="319">Access control · audit retention · data minimization</text><text x="835" y="337">Monitoring · error handling · support model</text></g><path d="M255 158h65m-8-7 8 7-8 7M540 158h65m-8-7 8 7-8 7M865 182h-28m8-7-8 7 8 7M430 265v-39m-7 8 7-8 7 8M540 309h175v-95m-7 8 7-8 7 8" class="e"/><rect x="35" y="382" width="1030" height="30" rx="8" fill="#172033"/><text x="550" y="402" text-anchor="middle" style="font:600 12px Arial,sans-serif;fill:#fff">Conceptual only — technology, hosting, API contracts and security controls are not finalized.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">PayTrack reconciliation process</title><desc id="desc">Illustrative flow from payment receipt through validation, matching, exception review and audit.</desc><defs><style>.t{font:600 16px Arial,sans-serif;fill:#172033}.s{font:12px Arial,sans-serif;fill:#657085}.e{stroke:#97a4b8;stroke-width:2.5;fill:none}.n{stroke:#dce3ed;stroke-width:1.5;fill:#fff}.w{fill:#fff5d9;stroke:#e7b957}.g{fill:#e5f7ed;stroke:#65bb8b}.o{fill:#fff3e9;stroke:#ed995e}</style></defs><rect width="1100" height="420" rx="24" fill="#f8fafc"/><text x="30" y="42" style="font:800 22px Arial,sans-serif;fill:#172033">PAYTRACK / RECONCILIATION WORKFLOW</text><text x="30" y="66" class="s">Illustrative business process · fictional scenario</text><rect x="25" y="130" width="138" height="66" rx="14" class="n"/><text x="94" y="158" text-anchor="middle" class="t">Payment</text><text x="94" y="178" text-anchor="middle" class="s">received</text><path d="M163 163h34m-8-7 8 7-8 7" class="e"/><rect x="197" y="130" width="155" height="66" rx="14" class="n"/><text x="274" y="158" text-anchor="middle" class="t">Validate fields</text><text x="274" y="178" text-anchor="middle" class="s">IDs · amount · currency</text><path d="M352 163h34m-8-7 8 7-8 7" class="e"/><path d="M435 120l54 43-54 43-54-43z" class="w"/><text x="435" y="159" text-anchor="middle" class="t">Valid?</text><path d="M489 163h44m-8-7 8 7-8 7" class="e"/><text x="508" y="149" class="s">Yes</text><rect x="533" y="130" width="165" height="66" rx="14" class="o"/><text x="615" y="158" text-anchor="middle" class="t">Match records</text><text x="615" y="178" text-anchor="middle" class="s">Internal ↔ gateway</text><path d="M698 163h28m-8-7 8 7-8 7" class="e"/><path d="M774 120l49 43-49 43-49-43z" class="w"/><text x="774" y="159" text-anchor="middle" class="t">Match?</text><path d="M823 163h36m-8-7 8 7-8 7" class="e"/><text x="837" y="149" class="s">Yes</text><rect x="859" y="130" width="190" height="66" rx="14" class="g"/><text x="954" y="158" text-anchor="middle" class="t">Mark reconciled</text><text x="954" y="178" text-anchor="middle" class="s">Capture audit event</text><path d="M774 206v76H662m8-7-8 7 8 7" class="e"/><text x="790" y="239" class="s">No</text><rect x="470" y="250" width="192" height="66" rx="14" class="w"/><text x="566" y="278" text-anchor="middle" class="t">Create exception</text><text x="566" y="298" text-anchor="middle" class="s">Reason code + owner</text><path d="M470 283h-37m8-7-8 7 8 7" class="e"/><rect x="274" y="250" width="159" height="66" rx="14" class="n"/><text x="354" y="278" text-anchor="middle" class="t">Review & resolve</text><text x="354" y="298" text-anchor="middle" class="s">Authorized user</text><rect x="25" y="352" width="1024" height="42" rx="10" fill="#172033"/><text x="537" y="378" text-anchor="middle" style="font:700 13px Arial,sans-serif;fill:#fff">AUDITABILITY · ACTOR + ACTION + TIMESTAMP · PRESERVE ORIGINAL VALUES</text></svg>
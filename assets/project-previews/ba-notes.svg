<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Knowledge notes portfolio preview</title><desc id="desc">Illustrative notebook workspace showing analysis notes, decision records, process sketches and reusable learning summaries. Not a screenshot of a live application.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf5"/><stop offset="1" stop-color="#eef3ff"/></linearGradient><style>.h{font:800 24px Arial,sans-serif;fill:#172033}.s{font:13px Arial,sans-serif;fill:#687386}.t{font:700 15px Arial,sans-serif;fill:#172033}.tag{font:700 10px Arial,sans-serif;fill:#b85b25}</style></defs>
<rect width="960" height="520" rx="28" fill="url(#bg)"/><rect x="0" y="0" width="960" height="72" rx="28" fill="#172033"/><rect x="0" y="42" width="960" height="30" fill="#172033"/><rect x="28" y="19" width="36" height="36" rx="10" fill="#e97833"/><text x="46" y="43" text-anchor="middle" style="font:800 16px Arial,sans-serif;fill:white">N</text><text x="80" y="43" style="font:800 20px Arial,sans-serif;fill:white">NOTES / KNOWLEDGE WORKSPACE</text><text x="928" y="43" text-anchor="end" style="font:700 10px Arial,sans-serif;fill:#c3ccda">ILLUSTRATIVE PREVIEW</text>
<rect x="32" y="98" width="560" height="386" rx="18" fill="#fff" stroke="#dce3ed" stroke-width="1.5"/><text x="60" y="137" class="h">Learning log</text><text x="60" y="161" class="s">Capture the question, evidence, decision and next step.</text>
<g><rect x="60" y="190" width="504" height="72" rx="12" fill="#fff7ef" stroke="#f0d6bd"/><circle cx="85" cy="216" r="10" fill="#e97833"/><text x="105" y="215" class="t">Business analysis patterns</text><text x="105" y="238" class="s">Requirements · acceptance criteria · traceability</text><rect x="60" y="276" width="504" height="72" rx="12" fill="#f4f7ff" stroke="#dce4f6"/><circle cx="85" cy="302" r="10" fill="#557fee"/><text x="105" y="301" class="t">Data and reporting notes</text><text x="105" y="324" class="s">SQL checks · KPI definitions · findings and caveats</text><rect x="60" y="362" width="504" height="72" rx="12" fill="#eef9f4" stroke="#d1ecdf"/><circle cx="85" cy="388" r="10" fill="#269777"/><text x="105" y="387" class="t">Process and delivery reflections</text><text x="105" y="410" class="s">Decision log · risk register · review checklist</text></g>
<rect x="616" y="98" width="312" height="386" rx="18" fill="#fff" stroke="#dce3ed" stroke-width="1.5"/><text x="642" y="137" class="t">A reusable note</text><text x="642" y="164" class="s">01 / Question</text><rect x="642" y="176" width="260" height="30" rx="7" fill="#f4f6fa"/><text x="654" y="196" class="s">What decision needs support?</text><text x="642" y="232" class="s">02 / Evidence</text><rect x="642" y="244" width="260" height="30" rx="7" fill="#f4f6fa"/><text x="654" y="264" class="s">Source, query, data quality</text><text x="642" y="300" class="s">03 / Decision</text><rect x="642" y="312" width="260" height="30" rx="7" fill="#f4f6fa"/><text x="654" y="332" class="s">Owner and rationale</text><text x="642" y="368" class="s">04 / Next step</text><rect x="642" y="380" width="260" height="30" rx="7" fill="#f4f6fa"/><text x="654" y="400" class="s">Action, dependency, checkpoint</text><rect x="642" y="432" width="142" height="27" rx="8" fill="#fff0e4"/><text x="713" y="450" text-anchor="middle" class="tag">ILLUSTRATIVE ONLY</text>
</svg>
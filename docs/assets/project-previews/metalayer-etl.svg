<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">MetaLayer ETL architecture preview</title><desc id="d">Illustrative data pipeline showing Bronze ingestion, Silver cleaning and validation, Gold analytics and orchestration controls.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8ff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient></defs><rect width="960" height="520" rx="26" fill="url(#bg)"/><text x="34" y="46" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#172438">METALAYER / DATA PIPELINE</text><text x="926" y="46" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#718096">ILLUSTRATIVE ARCHITECTURE</text><rect x="34" y="75" width="892" height="76" rx="15" fill="#172438"/><text x="60" y="108" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Orchestration & scheduling</text><text x="60" y="131" font-family="Arial,sans-serif" font-size="12" fill="#cbd5e1">Workflow dependencies · retries · monitoring</text><g font-family="Arial,sans-serif"><rect x="34" y="197" width="270" height="170" rx="17" fill="#fff" stroke="#d8e1ed" stroke-width="2"/><rect x="34" y="197" width="270" height="12" rx="6" fill="#b77e42"/><text x="58" y="246" font-size="13" font-weight="800" fill="#9b682f">01 / BRONZE</text><text x="58" y="278" font-size="23" font-weight="800" fill="#172438">Ingest</text><text x="58" y="309" font-size="14" fill="#687386">Capture source data</text><text x="58" y="333" font-size="14" fill="#687386">Keep raw representation</text><rect x="345" y="197" width="270" height="170" rx="17" fill="#fff" stroke="#d8e1ed" stroke-width="2"/><rect x="345" y="197" width="270" height="12" rx="6" fill="#8293aa"/><text x="369" y="246" font-size="13" font-weight="800" fill="#637187">02 / SILVER</text><text x="369" y="278" font-size="23" font-weight="800" fill="#172438">Clean & validate</text><text x="369" y="309" font-size="14" fill="#687386">Normalize and test quality</text><text x="369" y="333" font-size="14" fill="#687386">Resolve type issues</text><rect x="656" y="197" width="270" height="170" rx="17" fill="#fff" stroke="#d8e1ed" stroke-width="2"/><rect x="656" y="197" width="270" height="12" rx="6" fill="#e97833"/><text x="680" y="246" font-size="13" font-weight="800" fill="#d56729">03 / GOLD</text><text x="680" y="278" font-size="23" font-weight="800" fill="#172438">Model for analytics</text><text x="680" y="309" font-size="14" fill="#687386">Curated entities and measures</text><text x="680" y="333" font-size="14" fill="#687386">Reporting-ready outputs</text></g><path d="M304 283h41m-10-7 10 7-10 7M615 283h41m-10-7 10 7-10 7" stroke="#9aa8ba" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="34" y="402" width="892" height="70" rx="14" fill="#fff" stroke="#dce4ef"/><text x="58" y="430" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#172438">Shared controls</text><text x="58" y="452" font-family="Arial,sans-serif" font-size="12" fill="#687386">Data quality checks · logs · access · documentation · operational handover</text><text x="926" y="500" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#718096">Illustrative architecture — not a running system screenshot</text></svg>

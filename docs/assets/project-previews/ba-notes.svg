ight="700">DECISIONS & RAID</text><text x="344" y="252" fill="#26364b" font-size="17" font-weight="700">Make it traceable</text><circle cx="350" cy="280" r="5" fill="#557fee"/><path d="M365 280h165M344 307h186M344 331h150M344 355h172" stroke="#b9c9e7" stroke-width="7" stroke-linecap="round"/><text x="606" y="222" fill="#268263" font-size="13" font-weight="700">LEARNING SUMMARY</text><text x="606" y="252" fill="#26364b" font-size="17" font-weight="700">Useful takeaways</text><path d="M606 280h196M606 305h174M606 330h188M606 355h136" stroke="#9bcfba" stroke-width="7" stroke-linecap="round"/><rect x="60" y="420" width="780" height="28" rx="8" fill="#18283d"/><text x="450" y="439" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">ILLUSTRATIVE PREVIEW · NOT A LIVE APPLICATION SCREENSHOT</text></g></svg>
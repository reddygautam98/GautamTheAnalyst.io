<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b96a7"/></marker></defs><style>.title{font:700 25px Inter,Arial,sans-serif;fill:#19243a}.sub{font:13px Inter,Arial,sans-serif;fill:#697587}.node{fill:#fff;stroke:#d9e1eb;stroke-width:2}.nodeTitle{font:700 14px Inter,Arial,sans-serif;fill:#19243a}.nodeText{font:12px Inter,Arial,sans-serif;fill:#697587}.edge{fill:none;stroke:#8b96a7;stroke-width:2.3;marker-end:url(#arrow)}.tag{font:700 10px Inter,Arial,sans-serif;fill:#9b4e1b}.watermark{font:700 12px Inter,Arial,sans-serif;fill:#a45d2d}</style><rect width="1500" height="850" rx="28" fill="#f7f9fc"/><text x="52" y="56" class="title">PayTrack / Payment reconciliation process</text><text x="52" y="82" class="sub">Illustrative process flow for a fictional operations portal</text><text x="1450" y="55" text-anchor="end" class="tag">SAMPLE ONLY</text>

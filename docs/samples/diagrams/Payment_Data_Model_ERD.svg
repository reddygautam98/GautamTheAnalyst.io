<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">PayTrack logical data model</title><desc id="desc">Fictional logical model with payment transactions, gateway events, reconciliation results, exception cases and audit events.</desc><defs><style>.h{font:700 15px Arial,sans-serif;fill:#fff}.f{font:12px Arial,sans-serif;fill:#172033}.m{font:11px Arial,sans-serif;fill:#657085}.e{stroke:#8997ad;stroke-width:2;fill:none}</style></defs><rect width="1100" height="620" rx="24" fill="#f8fafc"/><text x="30" y="40" style="font:800 22px Arial,sans-serif;fill:#172033">PAYTRACK / LOGICAL DATA MODEL</text><text x="30" y="64" class="m">Illustrative entities and relationships · not a physical schema</text>
<g><rect x="38" y="112" width="280" height="190" rx="12" fill="#fff" stroke="#d9e1ed" stroke-width="1.5"/><path d="M38 124q0-12 12-12h256q12 0 12 12v32H38z" fill="#172033"/><text x="58" y="138" class="h">PAYMENT_TRANSACTION</text><text x="58" y="179" class="f">PK paymentId</text><text x="58" y="201" class="f">UK merchantReference</text><text x="58" y="223" class="f">amount, currency</text><text x="58" y="245" class="f">status, createdAt</text></g>
<g><rect x="430" y="100" width="260" height="150" rx="12" fill="#fff" stroke="#d9e1ed" stroke-width="1.5"/><path d="M430 112q0-12 12-12h236q12 0 12 12v32H430z" fill="#e97933"/><text x="450" y="126" class="h">GATEWAY_EVENT</text><text x="450" y="167" class="f">PK eventId</text><text x="450" y="189" class="f">FK paymentId</text><text x="450" y="211" class="f">eventType, receivedAt</text></g>
<g><rect x="430" y="314" width="260" height="150" rx="12" fill="#fff" stroke="#d9e1ed" stroke-width="1.5"/><path d="M430 326q0-12 12-12h236q12 0 12 12v32H430z" fill="#557fee"/><text x="450" y="340" class="h">RECONCILIATION_RESULT</text><text x="450" y="381" class="f">PK resultId</text><text x="450" y="403" class="f">FK paymentId</text><text x="450" y="425" class="f">matchStatus, reasonCode</text></g>
<g><rect x="790" y="100" width="270" height="160" rx="12" fill="#fff" stroke="#d9e1ed" stroke-width="1.5"/><path d="M790 112q0-12 12-12h246q12 0 12 12v32H790z" fill="#b8791d"/><text x="810" y="126" class="h">EXCEPTION_CASE</text><text x="810" y="167" class="f">PK caseId</text><text x="810" y="189" class="f">FK paymentId</text><text x="810" y="211" class="f">caseStatus, assignedTo</text><text x="810" y="233" class="f">resolutionType, updatedAt</text></g>
<g><rect x="790" y="350" width="270" height="170" rx="12" fill="#fff" stroke="#d9e1ed" stroke-width="1.5"/><path d="M790 362q0-12 12-12h246q12 0 12 12v32H790z" fill="#2b9068"/><text x="810" y="376" class="h">AUDIT_EVENT</text><text x="810" y="417" class="f">PK auditId</text><text x="810" y="439" class="f">FK paymentId, optional caseId</text><text x="810" y="461" class="f">actor, action, timestamp</text><text x="810" y="483" class="f">before/after reference</text></g>

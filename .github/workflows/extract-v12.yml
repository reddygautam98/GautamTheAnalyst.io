name: Publish Portfolio v12
# Re-trigger v12 extraction after correcting the deployment setup

on:
  push:
    branches: [main]
    paths:
      - 'Gautam_The_Analyst_Portfolio_v12.zip'
      - '.github/workflows/extract-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-v12:
    if: ${{ !contains(github.event.head_commit.message, '[skip v12 extraction]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract complete v12 site into docs
        shell: bash
        run: |
          set -euo pipefail
          test -s Gautam_The_Analyst_Portfolio_v12.zip
          rm -rf /tmp/portfolio-v12
          mkdir -p /tmp/portfolio-v12
          unzip -q Gautam_The_Analyst_Portfolio_v12.zip -d /tmp/portfolio-v12
          source_dir="/tmp/portfolio-v12/Gautam_The_Analyst_Complete_Source"
          test -d "$source_dir"
          test -s "$source_dir/index.html"
          rm -rf docs
          mkdir -p docs
          cp -a "$source_dir"/. docs/
          test -s docs/index.html
          echo "Extracted files:"
          find docs -type f | sort
      - name: Commit extracted website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No docs changes to commit."
            exit 0
          fi
          git commit -m "Publish complete v12 portfolio [skip v12 extraction]"
          git push origin HEAD:main

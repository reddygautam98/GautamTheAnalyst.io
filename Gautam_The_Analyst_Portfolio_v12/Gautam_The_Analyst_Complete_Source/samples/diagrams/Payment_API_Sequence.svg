<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
<title id="title">PayTrack API sequence diagram</title><desc id="desc">Illustrative API sequence showing a client app submitting a payment, payment API validation and gateway call, transaction persistence, status webhook, reconciliation job and status lookup.</desc>
<defs><style>.title{font:800 22px Arial,sans-serif;fill:#172033}.subtitle{font:12px Arial,sans-serif;fill:#64748b}.laneHead{fill:#172033}.laneTitle{font:700 14px Arial,sans-serif;fill:#fff}.life{stroke:#b9c5d6;stroke-width:2;stroke-dasharray:6 6}.msg{stroke:#e97833;stroke-width:2.4;fill:none;stroke-linecap:round}.reply{stroke:#5a79d6;stroke-width:2.2;fill:none;stroke-dasharray:6 5}.label{font:12px Arial,sans-serif;fill:#374151}.note{font:11px Arial,sans-serif;fill:#64748b}.call{fill:#fff3e9;stroke:#efc7a9;stroke-width:1.2}</style></defs>
<rect width="1180" height="620" rx="24" fill="#f8fafc"/><text x="30" y="42" class="title">PAYTRACK / API SEQUENCE</text><text x="30" y="64" class="subtitle">Fictional sequence for discussion · API contract and security model require engineering approval</text>
<g><rect x="50" y="96" width="145" height="45" rx="10" class="laneHead"/><text x="122" y="123" text-anchor="middle" class="laneTitle">Client App</text><line x1="122" y1="141" x2="122" y2="560" class="life"/><rect x="270" y="96" width="170" height="45" rx="10" class="laneHead"/><text x="355" y="123" text-anchor="middle" class="laneTitle">Payment API</text><line x1="355" y1="141" x2="355" y2="560" class="life"/><rect x="500" y="96" width="145" height="45" rx="10" class="laneHead"/><text x="572" y="123" text-anchor="middle" class="laneTitle">Gateway</text><line x1="572" y1="141" x2="572" y2="560" class="life"/><rect x="720" y="96" width="160" height="45" rx="10" class="laneHead"/><text x="800" y="123" text-anchor="middle" class="laneTitle">Transaction DB</text><line x1="800" y1="141" x2="800" y2="560" class="life"/><rect x="945" y="96" width="190" height="45" rx="10" class="laneHead"/><text x="1040" y="123" text-anchor="middle" class="laneTitle">Reconciliation Job</text><line x1="1040" y1="141" x2="1040" y2="560" class="life"/></g>
<path d="M122 178H355l-9-7m9 7-9 7" class="msg"/><text x="238" y="168" text-anchor="middle" class="label">POST /payments</text><rect x="292" y="189" width="126" height="33" rx="8" class="call"/><text x="355" y="210" text-anchor="middle" class="note">Validate request</text>
<path d="M355 239H572l-9-7m9 7-9 7" class="msg"/><text x="463" y="229" text-anchor="middle" class="label">Create payment</text><path d="M572 276H355l9-7m-9 7 9 7" class="reply"/><text x="463" y="266" text-anchor="middle" class="label">Gateway reference + status</text>
<path d="M355 313H800l-9-7m9 7-9 7" class="msg"/><text x="578" y="303" text-anchor="middle" class="label">Persist transaction</text><path d="M355 350H122l9-7m-9 7 9 7" class="reply"/><text x="238" y="340" text-anchor="middle" class="label">202 Accepted · payment ID</text>
<path d="M572 388H355l9-7m-9 7 9 7" class="msg"/><text x="463" y="378" text-anchor="middle" class="label">POST payment-status webhook</text><path d="M355 424H800l-9-7m9 7-9 7" class="msg"/><text x="578" y="414" text-anchor="middle" class="label">Update payment status</text>
<path d="M1040 462H800l9-7m-9 7 9 7" class="msg"/><text x="920" y="452" text-anchor="middle" class="label">Read unmatched records</text><path d="M1040 500H800l9-7m-9 7 9 7" class="msg"/><text x="920" y="490" text-anchor="middle" class="label">Save reconciliation result</text><path d="M122 538H355l-9-7m9 7-9 7" class="msg"/><text x="238" y="528" text-anchor="middle" class="label">GET /payments/{id}</text>
<rect x="28" y="572" width="1124" height="30" rx="8" fill="#eaf7f0" stroke="#b7e0cb"/><text x="590" y="592" text-anchor="middle" style="font:700 11px Arial,sans-serif;fill:#247453">CONTROL POINTS: input validation · authenticated webhook · idempotent event handling · audit log · safe error responses</text></svg>
